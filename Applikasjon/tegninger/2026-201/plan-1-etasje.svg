<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="sans-serif" font-size="12">
  <!-- Plantegning 1. etasje, sak 2026/201. Illustrasjon. 1 m = 25 px (M 1:100).
       Enebolig 15 x 8 m (x 80–455, y 200–400). Tilbygg 7 x 4 m (x 80–255, y 100–200). -->
  <rect x="0" y="0" width="640" height="600" fill="#ffffff"/>

  <!-- Gulvflater -->
  <rect x="80" y="200" width="375" height="200" fill="#e5e7eb"/>
  <rect x="80" y="100" width="175" height="100" fill="#fde68a"/>

  <!-- Yttervegger, 0,25 m -->
  <g fill="none" stroke="#111827" stroke-width="6">
    <rect x="83" y="203" width="369" height="194"/>
    <polyline points="83,203 83,103 252,103 252,203"/>
  </g>
  <!-- Innervegger -->
  <g stroke="#111827" stroke-width="3">
    <line x1="180" y1="203" x2="180" y2="397"/>
    <line x1="83" y1="320" x2="180" y2="320"/>
    <line x1="255" y1="203" x2="255" y2="397"/>
  </g>
  <!-- Ny åpning med dør fra gang til tilbygg (veggen mellom y 200 og tilbygget) -->
  <line x1="205" y1="203" x2="235" y2="203" stroke="#fde68a" stroke-width="7"/>
  <path d="M205,203 A30,30 0 0 1 235,173" fill="none" stroke="#111827"/>
  <!-- Vinduer -->
  <g stroke="#ffffff" stroke-width="7">
    <line x1="110" y1="103" x2="150" y2="103"/>
    <line x1="83" y1="140" x2="83" y2="170"/>
    <line x1="320" y1="397" x2="390" y2="397"/>
    <line x1="110" y1="397" x2="150" y2="397"/>
  </g>
  <g stroke="#111827" stroke-width="1">
    <line x1="110" y1="103" x2="150" y2="103"/>
    <line x1="83" y1="140" x2="83" y2="170"/>
    <line x1="320" y1="397" x2="390" y2="397"/>
    <line x1="110" y1="397" x2="150" y2="397"/>
  </g>

  <!-- Romnavn -->
  <text x="214" y="136" text-anchor="middle" font-size="10" font-weight="bold">SOVEROM 2</text>
  <text x="214" y="150" text-anchor="middle" font-size="10" font-weight="bold">(NYTT)</text>
  <text x="214" y="164" text-anchor="middle" font-size="10">BRA 25 m²</text>
  <text x="131" y="250" text-anchor="middle" font-size="11">Soverom 1</text>
  <text x="112" y="364" text-anchor="middle">Bad</text>
  <text x="217" y="300" text-anchor="middle">Gang</text>
  <text x="355" y="300" text-anchor="middle">Stue/kjøkken</text>

  <!-- Snittlinje A–A gjennom tilbyggets møne, sett mot øst -->
  <line x1="168" y1="70" x2="168" y2="430" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="12 4 3 4"/>
  <polygon points="168,64 168,76 186,70" fill="#dc2626"/>
  <polygon points="168,424 168,436 186,430" fill="#dc2626"/>
  <text x="192" y="74" fill="#dc2626" font-weight="bold">A</text>
  <text x="192" y="434" fill="#dc2626" font-weight="bold">A</text>

  <!-- Utvendige mål -->
  <g stroke="#111827" fill="none">
    <line x1="80" y1="85" x2="255" y2="85"/><line x1="80" y1="80" x2="80" y2="90"/><line x1="255" y1="80" x2="255" y2="90"/>
    <line x1="80" y1="450" x2="455" y2="450"/><line x1="80" y1="445" x2="80" y2="455"/><line x1="455" y1="445" x2="455" y2="455"/>
    <line x1="480" y1="200" x2="480" y2="400"/><line x1="475" y1="200" x2="485" y2="200"/><line x1="475" y1="400" x2="485" y2="400"/>
    <line x1="55" y1="100" x2="55" y2="200"/><line x1="50" y1="100" x2="60" y2="100"/><line x1="50" y1="200" x2="60" y2="200"/>
    <line x1="30" y1="100" x2="30" y2="400"/><line x1="25" y1="100" x2="35" y2="100"/><line x1="25" y1="400" x2="35" y2="400"/>
  </g>
  <text x="130" y="80" text-anchor="middle">7,0 m</text>
  <text x="268" y="466" text-anchor="middle">15,0 m</text>
  <text x="488" y="304">8,0 m</text>
  <text x="48" y="150" font-size="11" transform="rotate(-90 48 150)" text-anchor="middle">4,0 m</text>
  <text x="25" y="255" font-size="11" transform="rotate(-90 25 255)" text-anchor="middle">12,0 m</text>

  <!-- Tegnforklaring -->
  <rect x="300" y="110" width="14" height="10" fill="#fde68a" stroke="#111827"/>
  <text x="320" y="119" font-size="11">Nytt</text>
  <rect x="300" y="128" width="14" height="10" fill="#e5e7eb" stroke="#111827"/>
  <text x="320" y="137" font-size="11">Eksisterende</text>

  <!-- Nordpil -->
  <text x="590" y="110" text-anchor="middle" font-weight="bold">N</text>
  <line x1="590" y1="118" x2="590" y2="146" stroke="#111827" stroke-width="2"/>
  <polygon points="590,114 584,126 596,126" fill="#111827"/>

  <!-- Målestokklinje: 5 m = 125 px -->
  <rect x="80" y="490" width="62" height="5" fill="#111827" stroke="#111827"/>
  <rect x="142" y="490" width="63" height="5" fill="#ffffff" stroke="#111827"/>
  <text x="80" y="486" text-anchor="middle" font-size="10">0</text>
  <text x="205" y="486" text-anchor="middle" font-size="10">5 m</text>

  <!-- Tittelfelt -->
  <rect x="320" y="485" width="310" height="105" fill="#ffffff" stroke="#111827"/>
  <text x="330" y="503" font-weight="bold">PLANTEGNING 1. ETASJE · M 1:100</text>
  <text x="330" y="520" font-size="11">Gnr/bnr 12/34 · Solbakken 7, 9998 Hvileskjær</text>
  <text x="330" y="535" font-size="11">Tiltakshaver: Knut Solberg</text>
  <text x="330" y="550" font-size="11">Tiltak: Tilbygg til enebolig, 28 m²</text>
  <text x="330" y="565" font-size="11">Tegn.nr. A-01 · Dato 2026-09-10 · Vedlegg E-1</text>
  <text x="330" y="580" font-size="10" fill="#6b7280">Hele etasjen vist. Nytt areal markert gult.</text>
</svg>
