<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" font-family="sans-serif" font-size="12">
  <!-- Plankart for reguleringsplan 8888/2019001, M 1:1000. Illustrasjon. 1 m = 10 px. -->
  <rect x="0" y="0" width="520" height="340" fill="#ffffff"/>

  <!-- Veg -->
  <rect x="0" y="0" width="520" height="60" fill="#d1d5db"/>
  <text x="260" y="32" text-anchor="middle" font-weight="bold">Solbakken (o_veg)</text>
  <text x="10" y="50" fill="#374151" font-size="10">Planid 8888/2019001 · Illustrasjon</text>

  <!-- Naboeiendommer -->
  <rect x="0" y="70" width="50" height="200" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="25" y="175" text-anchor="middle" fill="#6b7280">12/33</text>
  <rect x="450" y="70" width="70" height="200" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="485" y="175" text-anchor="middle" fill="#6b7280">12/35</text>

  <!-- Eiendommen 12/34: arealformål BFS -->
  <rect x="50" y="70" width="400" height="200" fill="#fff7b2" stroke="#111827" stroke-width="2"/>
  <text x="250" y="110" text-anchor="middle" font-weight="bold">BFS</text>
  <text x="250" y="126" text-anchor="middle" fill="#374151">Frittliggende boligbebyggelse</text>
  <text x="250" y="262" text-anchor="middle" fill="#374151">12/34</text>

  <!-- Byggegrense mot veg: 6,0 m fra tomtegrensen -->
  <line x1="50" y1="130" x2="450" y2="130" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="446" y="124" text-anchor="end" fill="#b91c1c">6,0</text>

  <!-- Byggegrenser mot øvrige tomtegrenser: 4,0 m -->
  <line x1="90" y1="70" x2="90" y2="270" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="410" y1="70" x2="410" y2="270" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="50" y1="230" x2="450" y2="230" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="446" y="224" text-anchor="end" fill="#b91c1c">4,0</text>

  <!-- Forklaring -->
  <rect x="50" y="290" width="400" height="40" fill="#ffffff" stroke="#9ca3af"/>
  <line x1="60" y1="310" x2="90" y2="310" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="98" y="314">Byggegrense (m)</text>
  <rect x="250" y="302" width="18" height="14" fill="#fff7b2" stroke="#111827"/>
  <text x="276" y="314">BFS: bolig</text>

  <!-- Målestokklinje: 10 m = 100 px -->
  <rect x="50" y="360" width="50" height="4" fill="#111827" stroke="#111827"/>
  <rect x="100" y="360" width="50" height="4" fill="#ffffff" stroke="#111827"/>
  <text x="50" y="354" text-anchor="middle" font-size="10">0</text>
  <text x="100" y="354" text-anchor="middle" font-size="10">5</text>
  <text x="150" y="354" text-anchor="middle" font-size="10">10 m</text>
  <text x="510" y="372" text-anchor="end" font-weight="bold">M 1:1000</text>
</svg>
